services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no Coolify}
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID no Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY no Coolify}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        umask 077
        mkdir -p /run/seaweedfs
        printf '%s' '{"identities":[{"name":"meu-verdin-app","credentials":[{"accessKey":"'"$S3_ACCESS_KEY_ID"'","secretKey":"'"$S3_SECRET_ACCESS_KEY"'"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' > /run/seaweedfs/s3.json
        exec weed server -dir=/data -ip=seaweedfs -s3 -s3.config=/run/seaweedfs/s3.json
    volumes:
      - seaweedfs_data:/data
    expose:
      - "8333"

  storage-init:
    build:
      context: .
      dockerfile: Dockerfile.storage-init
    restart: "no"
    depends_on:
      seaweedfs:
        condition: service_started
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID no Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY no Coolify}
      S3_BUCKET: ${S3_BUCKET:?Configure S3_BUCKET no Coolify}
    command:
      - |
        until mc alias set seaweed http://seaweedfs:8333 "$${S3_ACCESS_KEY_ID}" "$${S3_SECRET_ACCESS_KEY}"; do sleep 2; done
        mc mb --ignore-existing seaweed/"$${S3_BUCKET}"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Keep this as a complete, URL-encoded connection string. Constructing it
      # from POSTGRES_PASSWORD breaks when a generated password contains @, :, / or #.
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no Coolify}
    command: ["/bin/sh", "-ec", "npm run db:migrate:deploy && npm run db:seed"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL no Coolify}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Configure BETTER_AUTH_SECRET no Coolify}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Configure BETTER_AUTH_URL no Coolify}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Configure GOOGLE_CLIENT_ID no Coolify}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Configure GOOGLE_CLIENT_SECRET no Coolify}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?Configure S3_BUCKET no Coolify}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Configure S3_ACCESS_KEY_ID no Coolify}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Configure S3_SECRET_ACCESS_KEY no Coolify}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  seaweedfs_data:
